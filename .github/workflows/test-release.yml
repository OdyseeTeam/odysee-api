name: Test & Release

on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'api-v*'
      - 'watchman-v*'
  pull_request:
    branches:
      - master
      - dev

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # - uses: FedericoCarboni/setup-ffmpeg@v3
      #   with:
      #     ffmpeg-version: 7.1

      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install ffmpeg

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
        id: go

      - name: Set up containers
        run: docker compose up -d

      - name: Set up containers
        run: docker compose -f apps/watchman/docker-compose.yml up -d clickhouse geoipupdate

      - name: Check running containers
        run: docker ps -a

      - name: Prepare for tests
        run: make prepare_test

      - name: Wait for wallet init
        run: scripts/wait_for_wallet.sh

      - name: Test
        env:
          OAUTH_TEST_CLIENT_SECRET: ${{ secrets.OAUTH_TEST_CLIENT_SECRET }}
          OAUTH_TEST_USERNAME: ${{ secrets.OAUTH_TEST_USERNAME }}
          OAUTH_TEST_PASSWORD: ${{ secrets.OAUTH_TEST_PASSWORD }}
          REAL_WALLET_PRIVATE_KEY: ${{ secrets.REAL_WALLET_PRIVATE_KEY }}
          REAL_WALLET_PUBLIC_KEY: ${{ secrets.REAL_WALLET_PUBLIC_KEY }}
          BUYER_WALLET_PRIVATE_KEY: ${{ secrets.BUYER_WALLET_PRIVATE_KEY }}
          BUYER_WALLET_PUBLIC_KEY: ${{ secrets.BUYER_WALLET_PUBLIC_KEY }}
          REFLECTOR_CONFIG: ${{ secrets.REFLECTOR_CONFIG }}
        run: |
          go install github.com/jandelgado/gcov2lcov@latest
          go test -short -covermode=count -coverprofile=coverage.out ./... && gcov2lcov -infile=coverage.out -outfile=coverage.lcov

      - uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: release
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
        id: go

      - name: Compute release details
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            app="${tag%%-v*}"
            version="${tag#*-v}"
            case "$app" in
              api|watchman) ;;
              *) echo "::error::unsupported app in tag: $app"; exit 1 ;;
            esac
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version does not match CalVer pattern: $version"
              exit 1
            fi
            case "$app" in
              api) image="odyseeteam/odysee-api" ;;
              watchman) image="odyseeteam/watchman" ;;
            esac
            {
              echo "APP_NAME=$app"
              echo "APP_VERSION=$version"
              echo "APP_IMAGE_TAG=$version"
              echo "DOCKER_TAGS<<EOF"
              echo "$image:$version"
              echo "$image:latest"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "APP_NAME=api"
              echo "APP_VERSION="
              echo "APP_IMAGE_TAG=$GITHUB_REF_NAME"
              echo "DOCKER_TAGS<<EOF"
              echo "odyseeteam/odysee-api:$GITHUB_REF_NAME"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Show release details
        run: |
          echo "::group::release details"
          echo "APP_NAME=$APP_NAME"
          echo "APP_VERSION=$APP_VERSION"
          echo "APP_IMAGE_TAG=$APP_IMAGE_TAG"
          echo "DOCKER_TAGS<<<"
          echo "$DOCKER_TAGS"
          echo ">>>"
          echo "ref=$GITHUB_REF"
          echo "::endgroup::"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # odysee-api

      - name: Build odysee-api binary
        if: env.APP_NAME == 'api'
        run: |
          if [ -z "$APP_VERSION" ]; then
            make oapi oapi_version="$GITHUB_SHA"
          else
            make oapi
          fi

      - name: Build and push odysee-api docker image
        if: env.APP_NAME == 'api'
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          tags: ${{ env.DOCKER_TAGS }}

      - name: Deploy odysee-api
        if: env.APP_NAME == 'api'
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
        run: |
          gh api repos/odyseeteam/misc-deployment/dispatches \
            -f event_type=deploy-odysee \
            -f "client_payload[tag]=$APP_IMAGE_TAG" \
            -f "client_payload[ref]=$GITHUB_REF" \
            -f 'client_payload[service]=odysee-api'

      # Watchman (tag push only)

      - name: Build watchman binary
        if: env.APP_NAME == 'watchman'
        run: make watchman

      - name: Build and push watchman docker image
        if: env.APP_NAME == 'watchman'
        uses: docker/build-push-action@v7
        with:
          push: true
          context: apps/watchman/
          tags: ${{ env.DOCKER_TAGS }}
          file: apps/watchman/Dockerfile

      - name: Deploy watchman
        if: env.APP_NAME == 'watchman' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
        run: |
          gh api repos/OdyseeTeam/misc-deployment/dispatches \
            -f event_type=deploy-odysee \
            -f "client_payload[tag]=$APP_IMAGE_TAG" \
            -f "client_payload[ref]=$GITHUB_REF" \
            -f 'client_payload[service]=watchman'
